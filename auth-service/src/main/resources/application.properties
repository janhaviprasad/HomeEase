spring.application.name=auth-service

server.port=8081

# Database - credentials from environment
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/homeease_auth?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

logging.level.org.springframework.security=TRACE

app.upload.dir=./uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# JWT - secret from environment, empty default so misconfiguration fails loudly
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=86400000

app.cors.allowed-origins=http://localhost:5173,http://localhost:19006,exp://localhost:19000,https://*.vercel.app,https://*.loca.lt,https://*.ngrok-free.dev,https://*.ngrok-free.app,https://*.ngrok.app

# Registration OTP email. MAIL_USERNAME / MAIL_PASSWORD from environment.
# Empty defaults are deliberate: missing variables must not stop the service
# booting - EmailService reports the misconfiguration instead.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.otp.expiry-minutes=10
app.otp.max-attempts=5
app.otp.resend-cooldown-seconds=30